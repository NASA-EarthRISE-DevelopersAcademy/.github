name: Update organization repository table

on:
  workflow_dispatch:
  schedule:
    - cron: "17 8 * * *"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-repository-table:
    name: Update repository table
    runs-on: ubuntu-latest

    steps:
      - name: Check out the member-profile repository
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Generate, commit, and push repository table
        env:
          GITHUB_ORGANIZATION: NASA-EarthRISE-DevelopersAcademy
          GITHUB_API_TOKEN: ${{ secrets.ORG_REPO_READ_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            echo "Update attempt ${attempt} of 3"

            # Start every attempt from the latest remote main branch.
            git fetch origin main
            git reset --hard origin/main

            # Regenerate the repository table against the latest README.
            python scripts/update_repository_table.py

            if git diff --quiet -- profile/README.md; then
              echo "The repository table is already current."
              exit 0
            fi

            git add profile/README.md
            git commit -m "Update organization repository table"

            if git push origin HEAD:main; then
              echo "Repository table pushed successfully."
              exit 0
            fi

            echo "Push was rejected because main changed. Retrying from the latest main branch."
            sleep $((attempt * 3))
          done

          echo "Unable to push after three attempts."
          exit 1
