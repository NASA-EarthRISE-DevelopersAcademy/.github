name: Update organization repository table

on:
  workflow_dispatch:
  schedule:
    - cron: "17 8 * * *"

permissions:
  contents: write

concurrency:
  group: update-organization-repository-table
  cancel-in-progress: false

jobs:
  update-repository-table:
    name: Update repository table
    runs-on: ubuntu-latest

    steps:
      - name: Check out the .github-private repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Generate repository table
        env:
          GITHUB_ORGANIZATION: NASA-EarthRISE-DevelopersAcademy
          GITHUB_API_TOKEN: ${{ secrets.ORG_REPO_READ_TOKEN }}
        run: python scripts/update_repository_table.py

      - name: Commit updated repository table
        shell: bash
        run: |
          if git diff --quiet -- profile/README.md; then
            echo "The repository table is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/README.md
          git commit -m "Update organization repository table"
          git push
